server {
    listen 8084;
    server_name _;

    client_max_body_size 160m; # 2026-11-13: 画布视频上传上限 150MiB（canvasRoutes MAX_VIDEO_UPLOAD_BYTES），留点 multipart 余量
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # gzip（2026-08-18）
    # 全局 nginx.conf 里 `gzip on` 是开的，但 `gzip_types` 整行被注释掉了，
    # nginx 默认只压 text/html；而且这个站所有响应都来自 proxy_pass，
    # 而 `gzip_proxied` 默认 off 就是“代理响应一律不压”——两个坐在一起，
    # 结果是主包 3.80 MB 原样下发（实测带 --compressed 也没有 Content-Encoding）。
    # 只在本站开，不改全局 nginx.conf，不影响同机其他站。
    #
    # 注意：故意不包含 text/event-stream。画布的实时推送（SSE）走它，
    # 压缩会把流缓冲住，实时同步就卡了。图片/视频也不列（本身已压缩，
    # 而且视频靠 Range 请求，gzip 会把 Content-Length 变成 chunked）。
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        text/javascript
        application/json
        text/css
        text/plain
        image/svg+xml
        application/xml
        text/xml;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
